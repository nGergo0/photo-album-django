name: Deploy with Terraform to OpenShift

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'Dockerfile'
      - 'webapp/**'
      - '.github/workflows/deploy-terraform.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      TF_VERSION: 1.6.0
      KUBECONFIG: ${{ github.workspace }}/.kube/config
      NAMESPACE: photo-album-pibk75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Create kubeconfig from secret
        run: |
          mkdir -p "${{ github.workspace }}/.kube"
          echo "${{ secrets.KUBECONFIG_CONTENT }}" | base64 -d > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          test -s "$KUBECONFIG"

      - name: Install OpenShift CLI
        run: |
          curl -L -o oc.tar.gz https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf oc.tar.gz oc kubectl
          sudo mv oc kubectl /usr/local/bin/
          oc version --client

      - name: Verify OpenShift connection
        run: |
          oc whoami
          oc project "$NAMESPACE"
          oc -n "$NAMESPACE" get pods

      - name: Detect project existence
        id: project_check
        run: |
          if oc get project "$NAMESPACE" >/dev/null 2>&1; then
            echo "create_project=false" >> "$GITHUB_OUTPUT"
            echo "Project exists: $NAMESPACE"
          else
            echo "create_project=true" >> "$GITHUB_OUTPUT"
            echo "Project missing, will be created by Terraform: $NAMESPACE"
          fi

      - name: Detect existing DB identity
        id: db_identity
        run: |
          if oc -n "$NAMESPACE" get secret db-postgres >/dev/null 2>&1; then
            existing_db_user=$(oc -n "$NAMESPACE" get secret db-postgres -o jsonpath='{.data.database-user}' | base64 -d)
            existing_db_name=$(oc -n "$NAMESPACE" get secret db-postgres -o jsonpath='{.data.database-name}' | base64 -d)

            echo "Using existing DB identity from secret db-postgres"
            echo "db_user=$existing_db_user" >> "$GITHUB_OUTPUT"
            echo "db_name=$existing_db_name" >> "$GITHUB_OUTPUT"
          else
            echo "No existing db-postgres secret found, using Terraform defaults"
            echo "db_user=photo-album-pibk75" >> "$GITHUB_OUTPUT"
            echo "db_name=photo-album-pibk75" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          cd terraform
          terraform init -backend=false

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan \
            -var="kubeconfig_path=${KUBECONFIG}" \
            -var="namespace=${NAMESPACE}" \
            -var="create_project=${{ steps.project_check.outputs.create_project }}" \
            -var="db_user=${{ steps.db_identity.outputs.db_user }}" \
            -var="db_name=${{ steps.db_identity.outputs.db_name }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="github_webhook_secret=${{ secrets.WEBHOOK_SECRET_GITHUB }}" \
            -var="generic_webhook_secret=${{ secrets.WEBHOOK_SECRET_GENERIC }}" \
            -out=tfplan

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve tfplan

      - name: Verify deployment
        run: |
          set +e
          app_status=0
          db_status=0

          echo "=== Rollout: photo-album-django ==="
          oc -n "$NAMESPACE" rollout status deployment/photo-album-django --timeout=5m
          app_status=$?

          echo "=== Rollout: db-postgres ==="
          oc -n "$NAMESPACE" rollout status deployment/db-postgres --timeout=5m
          db_status=$?

          echo "=== Pod Status ==="
          oc -n "$NAMESPACE" get pods -o wide

          echo "=== Deployment Status ==="
          oc -n "$NAMESPACE" get deployment

          if [ "$app_status" -ne 0 ] || [ "$db_status" -ne 0 ]; then
            echo "=== Recent Events ==="
            oc -n "$NAMESPACE" get events --sort-by=.metadata.creationTimestamp | tail -n 50

            echo "=== Failing Pod Logs (last 200 lines) ==="
            failing_pods=$(oc -n "$NAMESPACE" get pods --no-headers | awk '$3 ~ /CrashLoopBackOff|Error|ImagePullBackOff|CreateContainerConfigError|RunContainerError/ {print $1}')
            for pod in $failing_pods; do
              echo "--- Logs: $pod ---"
              oc -n "$NAMESPACE" logs "$pod" --all-containers=true --tail=200 || true
              echo "--- Describe: $pod ---"
              oc -n "$NAMESPACE" describe pod "$pod" || true
            done

            echo "Deployment verification failed."
            exit 1
          fi

      - name: Get Route URL
        run: |
          echo "=== Application Route ==="
          oc -n "$NAMESPACE" get route photo-album -o jsonpath='{.spec.host}' || echo "Route not yet available"

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Terraform deployment workflow completed. Check OpenShift cluster for updated resources.'
            })
